<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flux</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App bar: project · transport · preview · export · history -->
    <header id="top">
      <h1>Flux</h1>
      <span id="projName" class="muted">Untitled</span>
      <span class="badge" id="revBadge">rev 0</span>

      <button id="playBtn" title="Play / pause">Play</button>
      <button id="loopBtn" class="ghost" title="Toggle loop: forward / ping-pong">Loop: Fwd</button>
      <button id="fitBtn" class="ghost" title="Fit graph (1)">Fit</button>
      <button id="monitorBtn" class="ghost" title="Detached preview monitor">Monitor</button>
      <button id="newGraphBtn" class="ghost" title="New empty composition">New graph</button>
      <button id="importMediaBtn" class="ghost" title="Load a movie, GIF, or image source">Import media</button>
      <input id="mediaFile" type="file" accept="video/*,image/gif,image/*,.mov,.mp4,.m4v,.webm" style="display:none" />

      <span class="spacer"></span>

      <div id="saveBar">
        <input id="savePath" type="text" value="project.flux.json" title="Save path" />
        <button id="saveBtn">Save</button>
        <button id="openBtn">Open</button>
        <input id="openFile" type="file" accept=".json,.flux" style="display:none" />
        <input id="outDir" type="text" value="out" style="width:60px" title="Export output directory" />
        <select id="exportCodec" title="Export format" style="width:112px">
          <option value="h264">MP4 · H.264</option>
          <option value="hevc">MP4 · HEVC</option>
          <option value="prores">ProRes · .mov</option>
          <option value="gif">GIF</option>
          <option value="png">PNG sequence</option>
        </select>
        <label class="badge" title="Keep the intermediate PNG frames" style="display:flex;align-items:center;gap:4px;cursor:pointer">
          <input id="keepFrames" type="checkbox" style="width:auto" /> frames
        </label>
        <label class="range-export" title="Export width">W <input id="expW" type="range" min="320" max="7680" value="1280" /><output id="expWVal">1280</output></label>
        <label class="range-export" title="Export height">H <input id="expH" type="range" min="180" max="4320" value="720" /><output id="expHVal">720</output></label>
        <button id="exportBtn" class="primary">Export</button>
      </div>

      <button id="undoBtn" class="icon ghost" title="Undo (Ctrl+Z)">↶</button>
      <button id="redoBtn" class="icon ghost" title="Redo (Ctrl+Shift+Z)">↷</button>
    </header>

    <!-- Library: categorized, searchable, collapsible -->
    <aside id="lib">
      <div class="head">
        <div class="row"><input id="search" type="text" placeholder="Search nodes…" /></div>
      </div>
      <div class="tabs">
        <button data-tab="nodes" class="active">Nodes</button>
        <button data-tab="presets">Presets</button>
      </div>
      <div id="library"></div>
    </aside>

    <!-- Canvas: the primary surface -->
    <main id="center">
      <div id="viewport">
        <div id="world">
          <svg id="edges" xmlns="http://www.w3.org/2000/svg">
            <g id="edgeLayer" transform="translate(5000,5000)"></g>
          </svg>
        </div>
      </div>
      <div id="marquee"></div>
      <canvas id="minimap" width="168" height="108"></canvas>
      <div id="hud">
        <span class="fit" id="hudFit">Fit (1)</span>
        <span class="fit" id="hudAdd">Add node (Space)</span>
      </div>
    </main>

    <!-- Inspector + secondary timeline -->
    <aside id="right">
      <div id="inspector"><div class="muted">Select a node.</div></div>
      <div id="timelineWrap">
        <div id="timelineHead">
          <span>Timeline</span>
          <span class="dim" id="timelineRange"></span>
        </div>
        <div id="timeline"></div>
      </div>
    </aside>

    <!-- Status / performance -->
    <footer id="status">
      <span class="msg">ready</span>
      <span class="stat"></span>
      <span class="stat" id="perfStat"></span>
      <span class="stat" id="buildStat" title="Running build"></span>
    </footer>

    <!-- Spacebar node search -->
    <div id="searchOverlay">
      <div id="searchBox">
        <input id="searchInput" type="text" placeholder="Search nodes · ↑↓ to move · Enter to insert" autocomplete="off" />
        <div id="searchResults"></div>
      </div>
    </div>

    <!-- Context menu -->
    <div id="contextMenu"></div>

    <!-- Detached preview monitor -->
    <div id="monitor">
      <div id="monitorHead">
        <span>Preview</span>
        <span class="spacer" style="flex:1"></span>
        <button id="monitorFull" class="ghost" title="Fullscreen">⛶</button>
        <button id="monitorClose" class="ghost" title="Close">✕</button>
      </div>
      <img id="monitorImg" alt="preview monitor" />
      <canvas id="monitorCanvas" style="width:100%;aspect-ratio:16/9;display:none;background:#000"></canvas>
      <div class="mbody">
        <span class="dim">16:9</span>
        <span class="dim" id="monitorInfo"></span>
      </div>
    </div>

    <script>
      document.querySelector("#status .msg").textContent = "loading Flux…";
    </script>
    <script src="app.bundle.js?v=84d1413d9c1d" onerror="document.querySelector('#status .msg').textContent='startup error: UI bundle did not load'"></script>
  </body>
</html>
