<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flux</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --panel2: #22262e;
        --line: #2c313a;
        --text: #d7dbe2;
        --muted: #8a919c;
        --accent: #4a9eff;
        --ok: #46c07a;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
        display: grid;
        grid-template-rows: 48px 1fr 190px;
        grid-template-columns: 260px 1fr 320px;
        grid-template-areas: "top top top" "lib center insp" "time time time";
        height: 100vh;
      }
      #top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
      #lib { grid-area: lib; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
      #center { grid-area: center; display: flex; flex-direction: column; min-width: 0; }
      #insp { grid-area: insp; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; }
      #time { grid-area: time; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; padding: 10px; }
      h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
      button {
        background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #061222; font-weight: 600; }
      input[type=text], input[type=number] {
        background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 5px; padding: 5px 8px; font: inherit; width: 100%;
      }
      .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
      .muted { color: var(--muted); }
      .lib-item { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; }
      .lib-item:hover { background: var(--panel2); }
      .lib-cat { color: var(--muted); font-size: 11px; text-transform: uppercase; margin: 10px 4px 4px; }
      #previewWrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #0b0d10; }
      #preview { max-width: 96%; max-height: 96%; image-rendering: auto; background:
        repeating-conic-gradient(#1a1d22 0% 25%, #22262e 0% 50%) 50% / 20px 20px; }
      .inspector-param { display: grid; grid-template-columns: 90px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
      .clip { display: inline-block; background: #2a3242; border: 1px solid #3a4a66; border-radius: 5px;
        padding: 8px; margin-right: 6px; min-width: 140px; vertical-align: top; }
      .status { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-top: 8px; }
      .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
      #transport { display: flex; gap: 6px; align-items: center; }
      #history { color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="top">
      <h1>Flux</h1>
      <span id="projName" class="muted">Untitled</span>
      <span class="badge" id="revBadge">rev 0</span>
      <div id="transport">
        <button id="playBtn">Play</button>
        <button id="prevBtn">◀</button>
        <button id="nextBtn">▶</button>
      </div>
      <input id="outDir" type="text" value="out" style="width:160px" title="Export output directory" />
      <button id="exportBtn" class="primary">Export</button>
      <button id="undoBtn">Undo</button>
      <button id="redoBtn">Redo</button>
      <span id="history"></span>
    </div>
    <div id="lib">
      <div class="row"><input id="search" type="text" placeholder="Search effects & generators" /></div>
      <div id="library"></div>
    </div>
    <div id="center">
      <div id="previewWrap"><img id="preview" alt="preview" /></div>
    </div>
    <div id="insp">
      <strong>Inspector</strong>
      <div id="inspector" class="muted">Select a node.</div>
      <div class="status" id="status"></div>
    </div>
    <div id="time">
      <strong>Timeline</strong> <span id="rangeInfo" class="muted"></span>
      <div id="timeline" style="margin-top:8px"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
