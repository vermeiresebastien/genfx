[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/engine",
  "crates/render",
  "crates/media",
  "crates/audio",
  "crates/catalog",
  "crates/xtask",
  "crates/app",
  "crates/integrations",
  "crates/tests",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
crossbeam-channel = "0.5"
rustfft = "6"
glam = { version = "0.30", features = ["bytemuck"] }
rayon = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
