name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the verified host in this run. macOS matrix entries are
        # declared so when macOS runners exist they run the same steps; they are
        # not claimed as verified until a real run exists.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      # Any step that builds flux-desktop runs apps/desktop/src-tauri/build.rs,
      # and since I5 item 1 a bundler that cannot run is a hard build failure.
      # apps/desktop/node_modules is gitignored, so a fresh checkout could not
      # execute `node bundle.mjs` at all: measured at 63bc321 that died with
      # ERR_MODULE_NOT_FOUND, was swallowed as `cargo:warning=ui bundle failed
      # with exit ...`, and embedded the committed app.bundle.js under a green
      # build — the defect item 1 removes. Installing the lockfile's exact tree
      # is what makes the new gate runnable here rather than merely red. The npm
      # root is apps/desktop, not apps/desktop/ui, because the NSIS bundler
      # refuses a frontendDist that contains node_modules.
      - name: Install UI bundler dependencies (apps/desktop)
        run: npm ci
        working-directory: apps/desktop
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (no deny)
        run: cargo clippy --workspace --all-targets -- -A warnings
      - name: Workspace tests
        run: cargo test --workspace -- --test-threads=1
      - name: Catalog validation
        run: cargo run -q -p xtask -- catalog
      - name: Doctor (capabilities)
        run: cargo run -q -p xtask -- doctor
      - name: GPU catalog shader compile
        run: cargo run -q -p xtask -- test-gpu --profile baseline
      - name: Shader harness export (Naga validate)
        run: cargo run -q -p xtask --bin export_shaders
      # Compares the committed ledger with what the generator produces, writes nothing.
      # A Windows checkout materializes this file as CRLF (measured in a fresh clone of
      # this repo) while the generator emits LF, so --check normalizes both sides first.
      - name: Requirements ledger freshness (generated file matches its generator)
        run: cargo run -q -p xtask --bin requirements -- --check
      - name: Max for Live patch structure
        run: node apps/max-for-live/check-maxpat.cjs
      # The cache-buster gate (I5 item 2). It runs `node bundle.mjs` end to end in a
      # throwaway directory, so it needs the apps/desktop/ui devDependencies installed
      # by the npm ci step above — and it is the check that proves the bundler versions
      # the script tag rather than printing a hash and leaving index.html alone.
      - name: UI bundle cache-buster
        run: node apps/desktop/ui/check-bundle.mjs
      - name: Media fixtures
        run: cargo run -q -p xtask -- fixtures
      - name: Desktop GUI build
        run: cargo build -p flux-desktop
      - name: Release build
        run: cargo build --release -p flux-app
      # AT082's artifact. Until this tranche `bundle.active` was false, so no carrier in
      # this file or in verify.ps1 could produce an installer and the ledger cited a
      # command that built the CLI instead. cmd_package writes the installer path, size
      # and sha256 into implementation/evidence/package.json, which the evidence upload
      # below carries; a missing npm tree is exit 3, not a skipped step. Gated on the
      # runner OS the same way infrastructure/verify.ps1 gates its `installer-bundle`
      # step: NSIS is a Windows container, so on the macOS entry this matrix declares
      # for the future the step would be a red job over an artifact it cannot build.
      - name: Windows installer bundle
        if: runner.os == 'Windows'
        run: cargo run -q -p xtask -- package
      # Live WASAPI capture is a non-default feature on both crates, so nothing
      # above compiles it: measured at 9e113b4 the entire live-audio stack
      # (~2,400 lines plus 12 tests) was built by no gate. windows is a
      # cfg(windows) target dependency, so on a non-Windows runner these
      # commands fail to resolve the feature — the steps are gated on the
      # runner OS, not run blindly.
      - name: Live-audio platform tests (WASAPI capture)
        if: runner.os == 'Windows'
        run: cargo test -p flux-platform --features live-audio -- --test-threads=1
      - name: Live-audio app tests
        if: runner.os == 'Windows'
        # --test-threads=1 is load-bearing, not hygiene: without it this leg is a
        # measured deadlock (63 of 65 ok lines, no `test result:` line, still
        # spinning 2 h 38 m later), with it the same binary is 65 passed in 18.45 s
        # at ecf0274. Gated by `xtask --bin requirements -- --check`, which reads
        # this file, AGENTS.md and infrastructure/verify.ps1. The deadlock itself is
        # open: these tests reach export_project (a real GPU device) with no
        # gpu_lock() serialiser, unlike crates/tests/tests/dag_parallel.rs.
        run: cargo test -p flux-app --features live-audio -- --test-threads=1
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: implementation/evidence/**
      # The installer itself, so a reviewer can census the payload against the sha256 in
      # package.json instead of taking the evidence file's word for it. Unsigned: Windows
      # SmartScreen will warn on first run of an unfamiliar file.
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The two SDK legs below both hardcoded a toolchain the runner image does not have:
  # the cmake generator `Visual Studio 17 2022`, and a vcvars64.bat under the
  # `Microsoft Visual Studio\2022\Enterprise` edition directory. Measured on job
  # 132196889158 (image `windows-2025-vs2026`): the clone succeeds and cmake then dies
  # with "could not find any instance of Visual Studio." — before compiling any Flux
  # code. cmake 4.4.3 names the generator `Visual Studio 18 2026`, and this host's
  # install is `Microsoft Visual Studio\18\Community`, which is also what the repo's own
  # apps/spout-bridge/*.bat already call. So every push since the workflow could be read
  # at all reported failure for an environment fact.
  #
  # This job decides per leg, from the machine, and hands the legs the generator and
  # vcvars path it found instead of a second guess. A leg it cannot do is SKIPPED, which
  # AGENTS.md's rule makes the honest outcome for a missing prerequisite — blocked, never
  # a pass — and replaces the claim in the old comment above `link-integration`, which
  # said the job skips when the SDK is absent while no code anywhere implemented that.
  sdk-probe:
    name: sdk-probe (decides the optional legs)
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      link: ${{ steps.probe.outputs.link }}
      spout: ${{ steps.probe.outputs.spout }}
      generator: ${{ steps.probe.outputs.generator }}
      vcvars: ${{ steps.probe.outputs.vcvars }}
    steps:
      - name: Locate an MSVC toolchain
        id: probe
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $link = 'false'; $spout = 'false'; $generator = ''; $vcvars = ''
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($install) {
              $candidate = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $vcvars = $candidate
                $spout = 'true'
                # The directory above the edition is the product version: year-named for
                # 2019/2022, major-named from VS 2026 on. The strings are cmake's own
                # generator names, read out of `cmake --help` on cmake 4.4.3.
                $token = Split-Path -Leaf (Split-Path -Parent $install)
                $map = @{ '2019' = 'Visual Studio 16 2019'; '2022' = 'Visual Studio 17 2022';
                          '16' = 'Visual Studio 16 2019'; '17' = 'Visual Studio 17 2022';
                          '18' = 'Visual Studio 18 2026' }
                if ($map.ContainsKey($token) -and (Get-Command cmake -ErrorAction SilentlyContinue)) {
                  $generator = $map[$token]
                  $link = 'true'
                }
              }
            }
          }
          foreach ($kv in @(@{ k = 'link'; v = $link }, @{ k = 'spout'; v = $spout },
                            @{ k = 'generator'; v = $generator }, @{ k = 'vcvars'; v = $vcvars })) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$($kv.k)=$($kv.v)"
          }
          "PROBE: link=$link spout=$spout generator='$generator'"
          "PROBE: vcvars='$vcvars'"
          'PROBE: false means this runner cannot build that leg, so its job is SKIPPED. A skipped job is not a pass.'

  link-integration:
    name: ableton-link (optional)
    needs: sdk-probe
    if: needs.sdk-probe.outputs.link == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Ableton Link and build abl_link
        shell: pwsh
        env:
          GENERATOR: ${{ needs.sdk-probe.outputs.generator }}
        run: |
          git clone --depth 1 https://github.com/Ableton/link _upstream/link
          cd _upstream/link
          git submodule update --init --depth 1
          cmake -G "$env:GENERATOR" -A x64 -S . -B build
          cmake --build build --config Release --target abl_link
      - name: Build and test flux with link feature (GPLv2+ — local verify only)
        shell: pwsh
        run: |
          $env:FLUX_ABLETON_LINK_LIB = "$PWD\_upstream\link\build\Release"
          cargo test -p flux-integrations --features link link::
        shell: pwsh

  # NDI discovery (optional). The runtime DLL is not in CI; tests skip cleanly.
  ndi-feature:
    name: ndi (optional)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with ndi feature (compiles; discovery tests skip without runtime)
        run: "cargo test -p flux-integrations --features ndi ndi::"

  # Spout2 (optional). Builds the C++ shim from the Spout2 SDK, then the Rust adapter.
  # The vcvars path used to be hardcoded to the 2022 Enterprise edition; it now comes
  # from sdk-probe, so the leg runs on whatever edition the image ships and skips (not
  # fails) when the image has none. The env: indirection is deliberate — interpolating
  # needs.* outputs straight into a shell line is the Actions script-injection pattern.
  spout-feature:
    name: spout (optional)
    needs: sdk-probe
    if: needs.sdk-probe.outputs.spout == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Spout2 and build the C++ shim
        env:
          VCVARS: ${{ needs.sdk-probe.outputs.vcvars }}
        run: |
          git clone --depth 1 https://github.com/leadedge/Spout2 _upstream/spout2
          cmd /c "call `"$env:VCVARS`" && cd apps\spout-bridge && build_shim.bat && link_shim.bat"
        shell: pwsh
      - name: Build + test flux with spout feature
        run: |
          $env:FLUX_SPOUT_SHIM = "$PWD\apps\spout-bridge\spout_shim.dll"
          cargo test -p flux-integrations --features spout spout::
        shell: pwsh
