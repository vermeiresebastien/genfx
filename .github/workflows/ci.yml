name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the verified host in this run. macOS matrix entries are
        # declared so when macOS runners exist they run the same steps; they are
        # not claimed as verified until a real run exists.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (no deny)
        run: cargo clippy --workspace --all-targets -- -A warnings
      - name: Workspace tests
        run: cargo test --workspace -- --test-threads=1
      - name: Catalog validation
        run: cargo run -q -p xtask -- catalog
      - name: Doctor (capabilities)
        run: cargo run -q -p xtask -- doctor
      - name: GPU catalog shader compile
        run: cargo run -q -p xtask -- test-gpu --profile baseline
      - name: Shader harness export (Naga validate)
        run: cargo run -q -p xtask --bin export_shaders
      # Compares the committed ledger with what the generator produces, writes nothing.
      # A Windows checkout materializes this file as CRLF (measured in a fresh clone of
      # this repo) while the generator emits LF, so --check normalizes both sides first.
      - name: Requirements ledger freshness (generated file matches its generator)
        run: cargo run -q -p xtask --bin requirements -- --check
      - name: Max for Live patch structure
        run: node apps/max-for-live/check-maxpat.cjs
      - name: Media fixtures
        run: cargo run -q -p xtask -- fixtures
      - name: Desktop GUI build
        run: cargo build -p flux-desktop
      - name: Release build
        run: cargo build --release -p flux-app
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: implementation/evidence/**

  # Optional Ableton Link build. Runs only when a prebuilt abl_link.lib is present
  # (e.g. uploaded as an artifact); otherwise skipped — never fails for a missing SDK.
  link-integration:
    name: ableton-link (optional)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Ableton Link and build abl_link
        run: |
          git clone --depth 1 https://github.com/Ableton/link _upstream/link
          cd _upstream/link
          git submodule update --init --depth 1
          cmake -G "Visual Studio 17 2022" -A x64 -S . -B build
          cmake --build build --config Release --target abl_link
      - name: Build and test flux with link feature (GPLv2+ — local verify only)
        run: |
          $env:FLUX_ABLETON_LINK_LIB = "$PWD\_upstream\link\build\Release"
          cargo test -p flux-integrations --features link link::
        shell: pwsh

  # NDI discovery (optional). The runtime DLL is not in CI; tests skip cleanly.
  ndi-feature:
    name: ndi (optional)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with ndi feature (compiles; discovery tests skip without runtime)
        run: cargo test -p flux-integrations --features ndi ndi::

  # Spout2 (optional). Builds the C++ shim from the Spout2 SDK, then the Rust adapter.
  spout-feature:
    name: spout (optional)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Spout2 and build the C++ shim
        run: |
          git clone --depth 1 https://github.com/leadedge/Spout2 _upstream/spout2
          cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cd apps\spout-bridge && build_shim.bat && link_shim.bat"
        shell: pwsh
      - name: Build + test flux with spout feature
        run: |
          $env:FLUX_SPOUT_SHIM = "$PWD\apps\spout-bridge\spout_shim.dll"
          cargo test -p flux-integrations --features spout spout::
        shell: pwsh
