[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "requirements"
path = "src/bin/requirements.rs"


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flux-domain = { path = "../domain" }
flux-engine = { path = "../engine" }
flux-catalog = { path = "../catalog" }
flux-media = { path = "../media" }
flux-audio = { path = "../audio" }
flux-render = { path = "../render" }
wgpu = { workspace = true }
