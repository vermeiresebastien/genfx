[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "requirements"
path = "src/bin/requirements.rs"

[[bin]]
name = "export_shaders"
path = "src/bin/export_shaders.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Only `xtask evidence` uses this, to hash the build artifacts it reports on.
sha2 = "0.10"
flux-domain = { path = "../domain" }
flux-engine = { path = "../engine" }
flux-catalog = { path = "../catalog" }
flux-media = { path = "../media" }
flux-audio = { path = "../audio" }
flux-render = { path = "../render" }
wgpu = { workspace = true }

[dependencies.naga]
version = "27"
features = ["wgsl-in"]

# Only `xtask soak` uses this: peak working set of the process under test. Same version
# flux-platform already pins, so no new crate enters the lockfile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

