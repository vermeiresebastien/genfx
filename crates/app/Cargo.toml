[package]
name = "flux-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flux"
path = "src/main.rs"

[lib]
name = "flux_app"
path = "src/lib.rs"

[dependencies]
flux-domain = { path = "../domain" }
flux-engine = { path = "../engine" }
flux-catalog = { path = "../catalog" }
flux-render = { path = "../render" }
flux-media = { path = "../media" }
flux-audio = { path = "../audio" }
flux-integrations = { path = "../integrations" }
flux-platform = { path = "../platform" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
default = []
link = ["flux-integrations/link"]
ndi = ["flux-integrations/ndi"]
spout = ["flux-integrations/spout"]
vision = ["flux-integrations/vision"]
# Live WASAPI capture. Not in `default`, so the shipping build is unchanged;
# it only switches flux-platform's capture implementation from the stub that
# fails with `SdkMissing` to the real one.
live-audio = ["flux-platform/live-audio"]
