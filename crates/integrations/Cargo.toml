[package]
name = "flux-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
flux-domain = { path = "../domain" }
flux-engine = { path = "../engine" }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
rosc = "0.11"
midir = "0.11"

# ONNX inference via ONNX Runtime (statically linked; the `download-binaries`
# build feature fetches + statically links the runtime, so no runtime DLL ships).
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs"] }

[dev-dependencies]
crossbeam-channel = { workspace = true }

[features]
default = []
link = []
ndi = []
spout = []
syphon = []
vision = ["dep:ort"]

